[project]
name = "roomly"
version = "1.0.0"
description = "Multi-tenant meeting-room booking app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "psycopg_pool>=3.2,<4",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2,<3",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["roomly", "roomly.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008", # FastAPI's Depends()/Form() in argument defaults is the framework's idiom
  "S101", # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"roomly/migrate.py" = ["S603", "S607"] # psql is invoked with a fixed argv, no shell
"roomly/seed.py" = ["S311"]            # random is for demo data, not security
